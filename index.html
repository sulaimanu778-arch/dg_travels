<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Katsina Express</title>
    <script>
      function showErr(m){var d=document.createElement('pre');d.style.cssText='padding:1rem;color:#b3261e;white-space:pre-wrap';d.textContent='Error: '+m;document.body.prepend(d)}
      window.addEventListener('error',function(e){showErr(e.message)});
      window.addEventListener('unhandledrejection',function(e){showErr(String(e.reason))});
    </script>
  </head>
  <body>
    <div id="root"><p style="padding:1rem">Loading DG Travels…</p></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
